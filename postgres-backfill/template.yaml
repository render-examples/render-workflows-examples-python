# This file is used by `render workflows init` to scaffold new projects.
# It tells the CLI how to display this template and what instructions to show
# after scaffolding. You can safely ignore it when using this example directly.

name: Postgres Backfill
description: Resumable Postgres backfill as a flow, one checkpointed step per chunk

workflowsRoot: .

renderBuildCommand: pip install -r requirements.txt
renderStartCommand: python main.py

nextSteps:
  - label: Enter your project directory
    command: cd {{dir}}
  - label: Create a local database
    command: createdb postgres_backfill
    hint: Needs a local Postgres. The seed_orders task creates the tables.
  - label: Add your database URL
    command: cp .env.example .env
    hint: Then check DATABASE_URL in .env. The local task server loads .env when it starts, so do this first.
  - label: Start your local task server
    command: render workflows dev -- {{startCommand}}
    hint: Needs Render CLI 2.37 or later to run flows locally.
  - label: Seed 200,000 orders (in another terminal)
    command: "render workflows tasks runs start seed_orders --local --input='[200000]'"
  - label: Backfill in chunks of 5,000, with chunk 10 failing once
    command: "render workflows tasks runs start backfill_orders --local --input='[5000, null, 10]'"
    hint: Chunk 10 retries on its own; chunks 0 to 9 don't run again. The result ends with "remaining_nulls" 0.
  - label: Deploy to Render
    hint: |
      Push this code to a Git repository, then create two resources in the Render Dashboard, in the same region:
      • A Postgres database.
      • A workflow service. Build command: {{renderBuildCommand}}. Start command: {{renderStartCommand}}. Environment: DATABASE_URL (the database's internal URL).
